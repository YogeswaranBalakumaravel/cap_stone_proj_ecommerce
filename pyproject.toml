[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["instance"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mutmut]
source_paths = ["app"]
pytest_add_cli_args_test_selection = ["tests/"]
also_copy = ["config.py"]
