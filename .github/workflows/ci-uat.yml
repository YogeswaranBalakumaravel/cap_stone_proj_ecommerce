name: CI - UAT

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Security scan (bandit)
        run: bandit -r app/ -x app/static

      - name: Test (pytest)
        run: pytest --maxfail=1

      # Saves ruff and bandit findings for the gate findings commenter. The steps above still
      # decide pass or fail; this one re-runs both tools in report-only mode on PRs.
      - name: Save lint and security findings
        if: always() && github.event_name == 'pull_request'
        run: |
          mkdir -p .gate-out
          ruff check . --output-format json --exit-zero > .gate-out/ruff.json || true
          bandit -r app/ -x app/static -f json -o .gate-out/bandit.json --exit-zero || true

      - name: Upload lint and security findings
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: lint-security-report
          path: .gate-out/
          include-hidden-files: true # .gate-out is a dot-folder
          if-no-files-found: warn
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID_UAT: ${{ secrets.RENDER_SERVICE_ID_UAT }}
    steps:
      - name: Trigger Render deploy (UAT)
        if: ${{ env.RENDER_API_KEY != '' && env.RENDER_SERVICE_ID_UAT != '' }}
        run: |
          curl -fsS -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID_UAT/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json"
