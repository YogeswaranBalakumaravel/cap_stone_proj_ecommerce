name: CI - Dev

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Security scan (bandit)
        run: bandit -r app/ -x app/static

      - name: Test (pytest)
        run: pytest --maxfail=1

  deploy:
    needs: build
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID_DEV: ${{ secrets.RENDER_SERVICE_ID_DEV }}
    steps:
      - name: Trigger Render deploy (dev)
        if: ${{ env.RENDER_API_KEY != '' && env.RENDER_SERVICE_ID_DEV != '' }}
        run: |
          curl -fsS -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID_DEV/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json"
