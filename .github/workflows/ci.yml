name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Security scan (bandit)
        run: bandit -r app/ -x app/static

      - name: Test (pytest)
        run: pytest --maxfail=1

      # Saves ruff and bandit findings for the gate findings commenter. The steps above still
      # decide pass or fail; this one re-runs both tools in report-only mode on PRs.
      - name: Save lint and security findings
        if: always() && github.event_name == 'pull_request'
        run: |
          mkdir -p .gate-out
          ruff check . --output-format json --exit-zero > .gate-out/ruff.json || true
          bandit -r app/ -x app/static -f json -o .gate-out/bandit.json --exit-zero || true

      - name: Upload lint and security findings
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: lint-security-report
          path: .gate-out/
          include-hidden-files: true # .gate-out is a dot-folder
          if-no-files-found: warn
          retention-days: 7

  # Optional AI review gate: runs after lint/test are green, and only
  # annotates PRs for v1 (does not block merge/deploy). Wire in an
  # ANTHROPIC_API_KEY repo secret and a real script to enable it.
  # ai-review:
  #   needs: build
  #   if: github.event_name == 'pull_request'
  #   runs-on: ubuntu-24.04
  #   steps:
  #     - uses: actions/checkout@v7
  #     - name: Run AI review gate
  #       run: python scripts/ai_review.py
  #       env:
  #         ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render deploy
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
