name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Security scan (bandit)
        run: bandit -r app/ -x app/static

      - name: Test (pytest)
        run: pytest --maxfail=1

  # Optional AI review gate: runs after lint/test are green, and only
  # annotates PRs for v1 (does not block merge/deploy). Wire in an
  # ANTHROPIC_API_KEY repo secret and a real script to enable it.
  # ai-review:
  #   needs: build
  #   if: github.event_name == 'pull_request'
  #   runs-on: ubuntu-24.04
  #   steps:
  #     - uses: actions/checkout@v7
  #     - name: Run AI review gate
  #       run: python scripts/ai_review.py
  #       env:
  #         ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render deploy
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
