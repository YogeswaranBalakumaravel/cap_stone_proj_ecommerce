name: Gitleaks Secret Scan

# Scans for committed secrets (API keys, tokens, credentials) on main, dev
# and staging, using the official Gitleaks GitHub Action. Runs on every push to
# those branches and every pull request targeting them. No
# GITLEAKS_LICENSE is needed here -- that's only required when the repo
# owner is a GitHub Organization, not an individual user account.

on:
  push:
    branches: [main, dev, staging]
  pull_request:
    branches: [main, dev, staging]

permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, required for gitleaks to diff correctly

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
