<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Flagship Phones Showcase{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      {% set catalog = catalog_endpoint or 'main.index' %}
      <a class="brand" href="{{ url_for('main.index') }}">📱 Flagship Phones</a>
      <nav class="sections">
        <a href="{{ url_for('main.index') }}" class="{{ 'active' if catalog == 'main.index' else '' }}">Phones</a>
        <a href="{{ url_for('main.earbuds') }}" class="{{ 'active' if catalog == 'main.earbuds' else '' }}">Earbuds</a>
      </nav>
      <nav class="tabs">
        <a href="{{ url_for(catalog) }}" class="{{ 'active' if current_brand == 'All' else '' }}">All</a>
        <a href="{{ url_for(catalog, brand='Apple') }}" class="{{ 'active' if current_brand == 'Apple' else '' }}">Apple</a>
        <a href="{{ url_for(catalog, brand='Samsung') }}" class="{{ 'active' if current_brand == 'Samsung' else '' }}">Samsung</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Flagship Phones Showcase &mdash; a catalog demo, not a store. Specs &amp; prices are illustrative.</p>
    </div>
  </footer>
</body>
</html>
